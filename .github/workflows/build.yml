# GitHub Actions builds the box image and publishes it to GitHub's own
# registry, for free, on every tag that starts with v (or by hand from
# the Actions tab). Lives at .github/workflows/build.yml in the
# pando-box repo; box/README.txt says how the repo is made.
#
# Predicted tight spot: the free runner's disk (about 20 GB free) and
# a 9 GB base image that unpacks to more; the first step frees about
# 25 GB by removing tool chains the build does not use. If it still
# does not fit, build on a Mac with Docker Desktop (README).
name: build the box image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: free the runner's disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: sign in to ghcr.io (the repo's own token; no secret to keep)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the image's names (ghcr.io/<owner>/pando-box:<tag> and :latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
      - name: what was published
        run: echo "${{ steps.meta.outputs.tags }}" && df -h / | tail -1
